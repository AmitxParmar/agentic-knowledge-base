# Local development listener. TLS is required outside the laptop; the
# hosted broker decision (PHASE_2_PLAN O1) covers production transport.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
