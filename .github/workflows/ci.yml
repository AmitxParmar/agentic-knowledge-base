# CI — lint, typecheck, tests, and a non-blocking eval gate.
#
# Python (apps/api): ruff, basedpyright, pytest.
# TypeScript (monorepo): turbo lint + check-types across web/docs/ui.
# Eval (apps/api): retrieval golden-set eval. Runs only when the service
# secrets exist, and is non-blocking until the golden set is real
# (placeholder chunk ids — see docs/specs/evaluation.md §"50-100 cases").

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (ruff, basedpyright, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Ruff
        run: uv run ruff check .

      - name: Basedpyright
        run: uv run basedpyright

      - name: Pytest
        run: uv run pytest -q

  typescript:
    name: typescript (turbo lint, check-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check-types

  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dh
          POSTGRES_PASSWORD: dh
          POSTGRES_DB: dh
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The migration test drops and recreates the `core` schema, so point it
      # at the disposable service container, never at a real database.
      TEST_DATABASE_URL: postgres://dh:dh@localhost:5432/dh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install serial build deps
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  eval:
    name: eval (golden-set retrieval gates, non-blocking)    runs-on: ubuntu-latest
    if: ${{ secrets.DATABASE_URL != '' }}
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync dependencies (incl. dev group)
        run: uv sync --group dev

      - name: Run golden-set eval
        run: uv run python scripts/eval/run_eval.py --golden-set tests/fixtures/eval/golden_set.jsonl
