[project]
name = "api"
version = "0.1.0"
description = "Agentic Research Workspace — FastAPI gateway + worker"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # Orchestration (ADR-001)
    # langgraph-checkpoint-postgres excluded: it only ships stub methods for the
    # pinned langgraph 1.2.x — a minimal asyncpg checkpointer lives in
    # src/research/checkpoint.py instead.
    "langgraph>=0.2",
    # Multi-provider LLM routing — Model Gateway implementation (ADR-003)
    # LiteLLM handles provider routing, retries, and fallback (Groq → OpenRouter).
    "litellm>=1.40,<2.0",
    # Embeddings + rerank (Cohere) — replaces self-hosted BGE for the hosted demo
    "cohere>=5.5",
    # Object storage — Cloudflare R2 (S3-compatible uploads)
    "boto3>=1.34",
    # Embeddings + rerank (self-hosted BGE via HTTP, no extra SDK needed)
    # ponytail: httpx already pulled by fastapi, reuse it
    # Vector index (ADR-002)
    # turbovec: install separately — "pip install turbovec" once wheel is available
    # placeholder import path: src.retrieval.vector_index
    # Relational DB
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",         # async postgres driver
    "pgvector>=0.3.6",       # vector column type + distance ops (chunks.embedding)
    "alembic>=1.13",
    # Auth: HS256 JWT mint/verify (ADR-008). Already resolved transitively;
    # declared explicitly since src/auth/jwt.py imports it directly.
    "pyjwt>=2.8",
    # Ingestion tools
    "docling>=2.0",
    "faster-whisper>=1.0",
    "tree-sitter>=0.23",
    "gitingest>=0.1",
    "chonkie[semantic]>=0.4",
    # Async task queue (ingestion runs async per N4)
    "arq>=0.26",
    # Observability
    "logfire[fastapi,httpx,sqlalchemy]>=2.0",
    "langfuse>=2.0",         # per N3 — every agent run traced
    # Utilities
    "httpx>=0.27",           # internal HTTP calls (BGE endpoints, Model Gateway)
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",  # file uploads
    "structlog>=24.0",       # structured logging complement to logfire
    "websockets>=15.0.1",
    "pypdf>=6.14.2",
    "tree-sitter-language-pack>=1.14.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
