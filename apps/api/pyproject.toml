[project]
name = "api"
version = "0.1.0"
description = "Agentic Research Workspace — FastAPI gateway + worker"
requires-python = ">=3.11,<3.14"
dependencies = [
    # API
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.30",
    # Orchestration (ADR-001)
    "langgraph>=0.2",
    # LLM providers — Model Gateway backends (ADR-003)
    # Groq is primary, OpenRouter is fallback; both are openai-compatible
    "groq>=0.9",
    "openai>=1.40",          # used for OpenRouter (same SDK, different base_url)
    # Embeddings + rerank (self-hosted BGE via HTTP, no extra SDK needed)
    # ponytail: httpx already pulled by fastapi, reuse it
    # Vector index (ADR-002)
    # turbovec: install separately — "pip install turbovec" once wheel is available
    # placeholder import path: src.retrieval.vector_index
    # Relational DB
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",         # async postgres driver
    "alembic>=1.13",
    # Ingestion tools
    "docling>=2.0",
    "faster-whisper>=1.0",
    "tree-sitter>=0.23",
    "gitingest>=0.1",
    "chonkie[semantic]>=0.4",
    # Async task queue (ingestion runs async per N4)
    "arq>=0.26",
    # Observability
    "logfire[fastapi,httpx,sqlalchemy]>=2.0",
    "langfuse>=2.0",         # per N3 — every agent run traced
    # Utilities
    "httpx>=0.27",           # internal HTTP calls (BGE endpoints, Model Gateway)
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",  # file uploads
    "structlog>=24.0",       # structured logging complement to logfire
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]
