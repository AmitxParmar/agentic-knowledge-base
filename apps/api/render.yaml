# Render Blueprint — single deployment for the whole backend.
#
# One Web Service container runs the FastAPI gateway AND the arq ingestion
# worker (see apps/api/Dockerfile). Databases are external (Neon + Upstash)
# so nothing stateful lives in the container.
#
# No keep-warm cron: on the free tier every active minute counts toward the
# 750-hour monthly budget, and Render only offers cron jobs on paid plans.
# The service sleeps after idle and pays a short cold start on first hit —
# acceptable for a demo.

services:
  - type: web
    name: agentic-research-api
    runtime: docker
    plan: free
    dockerContext: apps/api
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        # Frontend is deployed separately (Vercel). Set to its origin, e.g.
        # https://your-app.vercel.app. Can hold comma-separated multiple origins.
        sync: false
      - key: DATABASE_URL
        # Points at the existing Neon project (pooler URL from apps/api/.env).
        # We do NOT use Render's managed `databases:` block so the deployed app
        # shares the same Postgres that already has our chunks + migrations.
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MODEL_GATEWAY_PROVIDER
        sync: false
      - key: MODEL_GATEWAY_MODEL
        sync: false
      - key: MODEL_GATEWAY_GROQ_API_KEY
        sync: false
      - key: MODEL_GATEWAY_OPENROUTER_API_KEY
        sync: false
      - key: MODEL_GATEWAY_OPENROUTER_MODEL
        sync: false
      # Embeddings + rerank (Cohere)
      - key: COHERE_API_KEY
        sync: false
      - key: COHERE_EMBED_MODEL
        sync: false
      - key: COHERE_RERANK_MODEL
        sync: false
      # Durable object storage (Backblaze B2 S3-compatible)
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_REGION
        sync: false
      - key: LOGFIRE_TOKEN
        sync: false
